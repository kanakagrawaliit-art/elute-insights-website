<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page.title }} | Elute Insights</title>

    <meta name="description" content="{{ page.description }}">

    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <header>
        <nav>
            <a href="/">Elute Insights</a>

            <div>
                <a href="/">Home</a>
                <a href="/#services">Services</a>
                <a href="/blog/">Blog</a>
                <a href="/#contact">Contact</a>
            </div>
        </nav>
    </header>


    <main class="blog-post">

        <article>

            <p class="post-category">
                {{ page.category }}
            </p>

            <h1>{{ page.title }}</h1>

            <p class="post-date">
                {{ page.date | date: "%B %d, %Y" }}
            </p>

            <div class="post-content">

                {{ content }}

            </div>

        </article>

    </main>


    <footer>

        <p>© Elute Insights</p>

    </footer>

</body>

</html>
